name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Checks + deploy package + draft release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION). Run 'npm version $TAG_VERSION' first and commit."
            exit 1
          fi
          echo "Releasing v${PKG_VERSION}"

      # The changelog entry is written before the tag (npm run release:prepare),
      # so the version is documented in the tree this run builds from. A tag cut
      # the other way cannot be repaired by a later commit — refuse early rather
      # than spend a runner on artifacts for an undocumented version.
      - name: Verify the tag carries its own changelog entry
        run: |
          ANCHOR=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^v/v-/; s/[.]/-/g')
          if ! grep -q "<a id=\"${ANCHOR}\">" CHANGELOG.md; then
            echo "::error::CHANGELOG.md of tag ${GITHUB_REF_NAME} has no entry for it. Cut the release with 'npm run release:prepare -- --version <X.Y.Z>' so the entry is committed before the tag."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      # Self-contained deploy package: dist + zero-dependency server + launcher.
      # Name matches the hueforge-web-*.zip glob below, so it ships as a
      # second release asset alongside the source archive.
      - name: Build deploy package
        run: npm run pack-deploy

      # git archive emits exactly the committed tree at this tag — no
      # node_modules, dist, or local cruft. This is what install.bat pulls.
      - name: Build source archive
        run: git archive --format=zip -o "hueforge-web-${GITHUB_REF_NAME}.zip" HEAD

      # Draft release with the web-deploy assets. The windows job below
      # attaches the Electron installer, latest.yml and blockmap to the same
      # draft, and the `publish` job then publishes it — the draft is a staging
      # area between the jobs, not a pause waiting for a human.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: hueforge-web-*.zip
          # Placeholder body: the `publish` job replaces it with the repository's
          # release-notes/<tag>.md so the release page and the tagged changelog
          # entry cannot tell two different stories. It only survives as the
          # body when that notes file is missing.
          generate_release_notes: true
          # A prerelease tag (v0.8.3-rc.4) must become a GitHub *pre-release*.
          # The desktop app polls `latest.yml` from the repository's latest
          # release (`releases/latest`, which skips pre-releases), so publishing
          # an RC as a normal release would push it to every stable install.
          prerelease: ${{ contains(github.ref_name, '-') }}

  windows-installer:
    name: Windows installer (Electron)
    needs: release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      # Native Windows runner: NSIS runs natively, no wine needed. Publishes
      # hueforge-desktop-setup-*.exe + latest.yml + blockmap to the draft release
      # created above — latest.yml is the feed electron-updater polls. The
      # publish job that follows verifies this manifest against the exe before
      # the release goes out.
      - name: Build Windows installer (Electron)
        run: npx electron-builder --win --x64 --publish always
        env:
          # electron-builder needs the repo to publish to; GH_TOKEN grants it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The step that used to be manual (`npm run release:publish`), and the one that
  # decides what every installed app receives: channel flags from the tag, the
  # body from the repository's notes, and a hard failure if `releases/latest`
  # would end up pointing at a candidate. It runs only once the installer job has
  # attached its files, and it publishes the draft those two jobs filled.
  #
  # The script is the same one a developer runs by hand, so the two paths cannot
  # drift apart: in CI the ``release/`` directory is empty, and it verifies the
  # artifacts sitting on the draft instead of a local build.
  publish:
    name: Publish the release (channel flags, notes, checks)
    needs: windows-installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The changelog entry and the notes are read out of the tag itself.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # No `npm ci`: the script uses only Node's own modules and the runner's `gh`.
      - name: Publish
        run: node scripts/release-publish.mjs --version "${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The entry itself is already inside the tag — this only refreshes the channel
  # word («Ожидает тега» → «Latest») and the link to the release page, so that
  # CHANGELOG.md on the default branch matches what the release page says.
  #
  # A refused push (protected branch) is a warning rather than a failed release:
  # the release itself is already published and nothing depends on this commit.
  # Pushes made with GITHUB_TOKEN do not start another workflow run.
  changelog:
    name: Refresh CHANGELOG on the default branch
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sync the changelog
        run: |
          npm run changelog:sync
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md уже описывает ${GITHUB_REF_NAME} — коммитить нечего"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "docs(changelog): канал ${GITHUB_REF_NAME} после публикации" -- CHANGELOG.md
          if ! git push origin "HEAD:${{ github.event.repository.default_branch }}"; then
            echo "::warning::CHANGELOG.md обновлён, но пуш отклонён — выполните npm run changelog:sync вручную"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
