name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Checks + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION). Run 'npm version $TAG_VERSION' first and commit."
            exit 1
          fi
          echo "Releasing v${PKG_VERSION}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      # Self-contained deploy package: dist + zero-dependency server + launcher.
      # Name matches the hueforge-web-*.zip glob below, so it ships as a
      # second release asset alongside the source archive.
      - name: Build deploy package
        run: npm run pack-deploy

      # git archive emits exactly the committed tree at this tag — no
      # node_modules, dist, or local cruft. This is what install.bat pulls.
      - name: Build source archive
        run: git archive --format=zip -o "hueforge-web-${GITHUB_REF_NAME}.zip" HEAD

      # Windows installer (NSIS, x64) with electron-updater auto-update support.
      # Publishes latest.yml + the .exe blockmap to the release, which
      # electron-updater in the installed app polls for updates.
      - name: Build Windows installer (Electron)
        run: npx electron-builder --win --x64 --publish always
        env:
          # electron-builder needs the repo to publish to; GH_TOKEN grants it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: hueforge-web-*.zip
          generate_release_notes: true
